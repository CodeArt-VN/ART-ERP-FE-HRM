<ion-header [translucent]="true">
	<app-toolbar [page]="this"></app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="left scrollx" forceOverscroll="false">
	<app-page-title class="ion-padding safe-max-width" [pageConfig]="pageConfig"></app-page-title>

	<div class="safe-max-width">
		<app-data-table
			class="box-shadow responsive"
			[rows]="items"
			[trackBy]="'Id'"
			[(selectedRows)]="selectedItems"
			[showSpinner]="pageConfig.showSpinner"
			[showFilter]="pageConfig.isShowSearch"
			[(query)]="query"
			(dataInfinite)="loadData($event)"
			(filter)="onDatatableFilter($event)"
			(sort)="onSort($event)"
			(selectedRowsChange)="showCommandBySelectedRows($event)"
		>
			<datatable-column [checkbox]="true" name=""></datatable-column>
			<datatable-column class="col-id" name="#" property="Id" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="col-code" name="Staff" property="IDStaff" [navLink]="pageConfig.pageName">
				<ng-template let-i="row" datatable-cell-template>
					{{i.Staff?.FullName}}
				</ng-template>
			</datatable-column>
			<datatable-column class="col-name" name="Equipment Name" property="Name" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="col-id" name="CanCheckIn" property="IsAllowCheckIn">
				<ng-template datatable-filter-template>
					<div
						class="col-id cell cell-btn"
						(click)="query.IsAllowCheckIn=query.IsAllowCheckIn===true?false:(query.IsAllowCheckIn===false? '': true); refresh()"
					>
						<ion-icon
							class="min-btn"
							[name]="query.IsAllowCheckIn===true?'checkmark-outline':(query.IsAllowCheckIn===false?'ban-outline':'checkmark-done-outline')"
						></ion-icon>
					</div>
				</ng-template>
				<ng-template let-i="row" datatable-cell-template>
					<ion-icon class="min-btn" *ngIf="i.IsAllowCheckIn" name="checkmark"></ion-icon>
				</ng-template>
			</datatable-column>
		</app-data-table>
	</div>

	<div class="ion-padding"></div>
</ion-content>
